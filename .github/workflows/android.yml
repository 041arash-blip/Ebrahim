- name: List generated APKs
        run: |
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -ls
          mkdir -p output_apk
          find . -name "*.apk" -exec cp {} output_apk/ \;

      - name: Upload APK on Success
        uses: actions/upload-artifact@v4
        with:
          name: SmartRisk-apk
          path: |
            output_apk/*.apk
            bin/*.apk
            **/*.apk
          if-no-files-found: warn
