[app]

# (str) Title of your application
title = SmartRisk

# (str) Package name
package.name = smartrisk

# (str) Package domain (needed for android packaging)
package.domain = org.smartrisk

# (str) Source code where the main.py lives
source.dir = .

# (list) Source files to include
source.include_exts = py,png,jpg,kv,atlas,json

# (list) Application requirements
requirements = python3,kivy==2.2.1

# (list) Supported orientations
orientation = portrait

# (list) Permissions
android.permissions = INTERNET

# (list) Target architectures
android.archs = arm64-v8a, armeabi-v7a

# (int) Target Android API
android.api = 31

# (int) Minimum API required
android.minapi = 21

# (int) Android SDK version
android.sdk = 31

# (str) Android NDK version
android.ndk = 25b

# (int) NDK API level to target
android.ndk_api = 24

# (bool) Accept SDK license automatically
android.accept_sdk_license = True

[buildozer]

# (int) Log level (0 = error only, 1 = info, 2 = debug (with command output))
log_level = 2

# (int) Display warning if buildozer is run as root (0 = False, 1 = True)
warn_on_root = ثابت `kivy==2.2.1`) کاملاً صحیح و استاندارد است. 

تنها نکته بسیار مهم در فایل‌های buildozer.spec این است که بخش تنظیمات عمومی Buildozer یعنی `[buildozer]` و تعیین سطح گزارش لاگ‌ها (`log_level`) نباید در انتهای فایل خالی بماند تا هنگام بیلد، خروجی لاگ‌ها کامل و قابل بررسی باشد.

نسخه نهایی، تمیز و کامل زیر را آماده کرده‌ام که می‌توانید مستقیماً کپی کرده و در فایل buildozer.spec ذخیره (Commit) کنید:
```ini
[app]

# (str) Title of your application
title = SmartRisk

# (str) Package name
package.name = smartrisk

# (str) Package domain (needed for android packaging)
package.domain = org.smartrisk

# (str) Source code where the main.py lives
source.dir = .

# (list) Source files to include
source.include_exts = py,png,jpg,kv,atlas,json

# (list) Application requirements
requirements = python3,kivy==2.2.1

# (list) Supported orientations
orientation = portrait

# (list) Permissions
android.permissions = INTERNET

# (list) Target architectures
android.archs = arm64-v8a, armeabi-v7a

# (int) Target Android API
android.api = 31

# (int) Minimum API required
android.minapi = 21

# (int) Android SDK version
android.sdk = 31

# (str) Android NDK version
android.ndk = 25b

# (int) NDK API level to target
android.ndk_api = 24

# (bool) Accept SDK license automatically
android.accept_sdk_license = True

[buildozer]

# (int) Log level (0 = error only, 1 = info, 2 = debug (with command output))
log_level = 2

# (int) Display warning if buildozer is run as root (0 = False, 1 = True)
warn_on_root = 1
