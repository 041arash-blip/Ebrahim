name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool pkg-config zlib1g-dev \
            libncurses5 libstdc++6 cmake build-essential \
            ccache libffi-dev libssl-dev libltdl-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Cython==0.29.36 buildozer

      - name: Build APK with Buildozer
        run: |
          set -o pipefail
          yes | buildozer android debug 2>&1 | tee build.log

      - name: Print Last Error Lines
        if: always()
        run: |
          echo "==================== LAST 100 LINES OF BUILD LOG ===================="
          if [ -f build.log ]; then
            tail -n 100 build.log
          else
            echo "build.log file not found."
          fi
          echo "====================================================================="

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SmartRisk-build-log
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SmartRisk-APK
          path: bin/*.apk
