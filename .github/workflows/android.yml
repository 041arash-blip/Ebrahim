name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.22.04

    steps:
      - name: Checkout repository
        uses/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: List generated APKs
        if: always()
        run: |
          echo "=== Current directory ==="
          pwd

          echo "=== Project files ==="
          find . -maxdepth 4 -type f | sort | head -n 300

          echo "=== Searching for APK files ==="
          find . -type f -iname "*.apk" -print

          mkdir -p output_apk

          find . -type f -iname "*.apk" -exec cp -f {} output_apk/ \;

          echo "=== Files prepared for upload ==="
          ls -lah output_apk || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartRisk-apk
          path: output_apk/*.apk
          if-no-files-found: error
