name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config cmake libffi-dev libssl-dev zlib1g-dev libsqlite3-dev libbz2-dev liblzma-dev libreadline-dev libgdbm-dev libncurses-dev libgl-dev libgles2-mesa-dev ccache

      - name: Install Python Build Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer>=1.5.0" "cython<3.0"

      - name: Build with Buildozer
        run: |
          buildozer -v android debug 2>&1 | tee build_output.log

      - name: Show Error Summary if Failed
        if: failure()
        run: |
          echo "=== LAST 100 LINES OF BUILD LOG ==="
          tail -n 100 build_output.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SmartRisk-App
          path: bin/*.apk

      - name: Upload Full Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build_output.log
