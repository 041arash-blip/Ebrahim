name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev libffi-dev libssl-dev ccache lld

      - name: Install Python build tools
        run: |
          pip install --upgrade pip setuptools wheel
          pip install Cython==0.29.36 buildozer

      - name: Build APK with Buildozer
        id: build_step
        continue-on-error: true
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee raw_build.log
          exit ${PIPESTATUS[0]}

      - name: Show Exact Root Error
        if: steps.build_step.outcome == 'failure'
        run: |
          echo "==================== [ START OF REAL ERROR ] ===================="
          # فیلتر کردن و نمایش خطاهای واقعی کامپایل و پایتون
          grep -C 5 -i -E "error:|fatal error|exception|traceback|cannot find|undefined reference|failed with exit code" raw_build.log | tail -n 60 || true
          echo "==================== [ LAST 40 LINES OF BUILD ] ===================="
          tail -n 40 raw_build.log || true
          echo "==================== [ END OF LOG ] ===================="

      - name: Upload APK
        if: steps.build_step.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SmartRisk-APK
          path: bin/*.apk

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-build-log
          path: raw_build.log

      - name: Check Final Status
        if: steps.build_step.outcome == 'failure'
        run: exit 1
