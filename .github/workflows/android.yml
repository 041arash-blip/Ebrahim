'success'
        uses: actions/upload-artifact@v4
        with:
          name: SmartRisk-APK
          path: bin/*.apk

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-build-log
          path: raw_build.log

      - name: Check final status
        if: steps.build_step.outcome == 'failure'
        run: exit 1
