name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Prepare Android SDK Structure for Buildozer
        run: |
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/tools/bin
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          ln -sf $ANDROID_HOME/build-tools /home/runner/.buildozer/android/platform/android-sdk/build-tools
          ln -sf $ANDROID_HOME/platforms /home/runner/.buildozer/android/platform/android-sdk/platforms
          ln -sf $ANDROID_HOME/platform-tools /home/runner/.buildozer/android/platform/android-sdk/platform-tools
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: List and Prepare APKs
        if: always()
        run: |
          echo "=== Searching for APK files ==="
          mkdir -p output_apk
          find . -type f -iname "*.apk" -exec cp -v {} output_apk/ \;
          echo "=== Files ready to upload ==="
          ls -lah output_apk

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartRisk-apk
          path: output_apk/*.apk
          if-no-files-found: warn
