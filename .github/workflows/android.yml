yaml
name: Android Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v3
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git libncurses5-dev libstdc++6 libffi-dev libssl-dev libtinfo5 autoconf libtool pkg-config zlib1g-dev
          
      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          buildozer_version: stable
        env:
          # این بخش به حل مشکل SDK کمک می‌کند
          ANDROID_HOME: /usr/local/lib/android/sdk
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: package
          path: bin/*.apk
