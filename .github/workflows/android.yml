name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc "/usr/local/share/boost"
          sudo apt-get clean

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git ffmpeg libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev \
            libavformat-dev libavcodec-dev zlib1g-dev openjdk-17-jdk \
            unzip zip ccache autoconf libtool pkg-config libssl-dev libffi-dev

      - name: Force Python 3.10 as system python3 (AFTER apt)
        run: |
          PY310_BIN=$(python -c "import sys; print(sys.executable)")
          sudo rm -f /usr/bin/python3 /usr/bin/python
          sudo ln -s "$PY310_BIN" /usr/bin/python3
          sudo ln -s "$PY310_BIN" /usr/bin/python
          python3 --version

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.33" "buildozer==1.5.0" virtualenv

      - name: Build APK with Buildozer
        env:
          APP_ANDROID_ARCHS: "arm64-v8a"
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Print last 150 lines of build log (on failure)
        if: failure()
        run: |
          if [ -f build.log ]; then tail -n 150 build.log; else echo "No build.log — buildozer step never ran or failed before logging."; fi

      - name: Upload APK Artifact
        if: always()
        uses: failed before logging."; fi

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartRisk-APK
          path: bin/*.apk
          if-no-files-found: warn
