name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip wget autoconf automake libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install "cython<3"
          python3 -m pip install --upgrade buildozer

      - name: Prepare Android SDK
        shell: bash
        run: |
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$ANDROID_HOME"
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O commandlinetools.zip
          unzip -q commandlinetools.zip -d "$ANDROID_HOME"
          mv "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/tools"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/tools" "$ANDROID_HOME/cmdline-tools/latest"
          ln -s "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          mkdir -p "$ANDROID_HOME/build-tools"
          ln -sfn "$ANDROID_HOME/build-tools/35.0.0" "$ANDROID_HOME/build-tools/37.0.0"

      - name: Build APK with Buildozer
        env:
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
        run: |
          buildozer android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SmartRisk-apk
          path: bin/*.apk
