name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            clang \
            lld \
            ccache \
            patch

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade "cython<3.0" buildozer setuptools wheel

      - name: Setup Android SDK Symlinks and Accept Licenses
        run: |
          # ساخت ساختار کامل پوشه SDK برای بیلدوزر
          SDK_DIR="/home/runner/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR/tools/bin"
          mkdir -p "$SDK_DIR/cmdline-tools/latest/bin"

          # کپی/لینک مستقیم ابزارها
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/* "$SDK_DIR/tools/bin/"
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/* "$SDK_DIR/cmdline-tools/latest/bin/"
          ln -sf $ANDROID_HOME/build-tools "$SDK_DIR/build-tools"
          ln -sf $ANDROID_HOME/platforms "$SDK_DIR/platforms"
          ln -sf $ANDROID_HOME/platform-tools "$SDK_DIR/platform-tools"

          # تایید قوانین لایسنس
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK with Buildozer
        env:
          ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk
          ANDROIDNDK: /home/runner/.buildozer/android/platform/android-ndk-r25b
        run: |
          # اجبار به معماری پایدار arm64-v8a
          buildozer -v android debug

      - name: List and Prepare APKs
        if: always()
        run: |
          mkdir -p output_apk
          find . -type f -iname "*.apk" -exec cp -v {} output_apk/ \;
          ls -lah output_apk

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartRisk-apk
          path: output_apk/*.apk
          if-no-files-found: warn
