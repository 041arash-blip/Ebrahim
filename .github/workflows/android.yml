name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip wget autoconf automake libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install "cython<3"
          python3 -m pip install buildozer

      - name: Prepare Android SDK
        shell: bash
        run: |
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$ANDROID_HOME"
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O commandlinetools.zip
          unzip -q commandlinetools.zip -d "$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/tools_temp" 2>/dev/null || true
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          if [ -d "$ANDROID_HOME/tools_temp" ]; then
            mv "$ANDROID_HOME/tools_temp/"* "$ANDROID_HOME/cmdline-tools/latest/" 2>/dev/null || true
            rm -rf "$ANDROID_HOME/tools_temp"
          fi
          ln -s "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools" 2>/dev/null || true
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Build APK with Buildozer
        id: run_build
        continue-on-error: true
        env:
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
        run: |
          buildozer -v android debug 2>&1 | tee build_output.log

      - name: Save Error Log on Failure
        if: steps.run_build.outcome != 'success'
        run: |
          echo "=== 50 LINES OF ERROR LOG ===" > error-summary.txt
          tail -n 50 build_output.log >> error-summary.txt

      - name: Upload Error Log
        if: steps.run_build.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: error-summary
          path: error-summary.txt

      - name: Upload APK on Success
        if: steps.run_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SmartRisk-apk
          path: bin/*.apk

      - name: Fail workflow if build failed
        if: steps.run_build.outcome != 'success'
        run: exit 1
