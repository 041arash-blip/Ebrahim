- name: Prepare Android SDK
        shell: bash
        run: |
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O commandlinetools.zip

          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

          unzip -q commandlinetools.zip \
            -d "$ANDROID_HOME/cmdline-tools/latest"

          # ساختار ZIP معمولاً latest/cmdline-tools است.
          # محتویات آن باید مستقیماً در latest قرار بگیرند.
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/cmdline-tools" ]; then
            mv "$ANDROID_HOME/cmdline-tools/latest/cmdline-tools/"* \
              "$ANDROID_HOME/cmdline-tools/latest/"
            rmdir "$ANDROID_HOME/cmdline-tools/latest/cmdline-tools"
          fi

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          # Buildozer گاهی دنبال نسخه 37 می‌گردد؛ آن را به نسخه نصب‌شده هدایت می‌کنیم.
          mkdir -p "$ANDROID_HOME/build-tools"
          ln -sfn "$ANDROID_HOME/build-tools/35.0.0" \
            "$ANDROID_HOME/build-tools/37.0.0"

          # بررسی قطعی وجود aidl
          test -x "$ANDROID_HOME/build-tools/35.0.0/aidl"
          ls -l "$ANDROID_HOME/build-tools/35.0.0/aidl"
