name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            clang \
            lld \
            ccache

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          pip install "cython==0.29.36" "buildozer==1.5.0" setuptools wheel virtualenv

      - name: Install Android Platform 33 & Accept Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.2"

      - name: Prepare Android SDK Structure
        run: |
          SDK_DIR="/home/runner/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR/tools/bin"
          mkdir -p "$SDK_DIR/cmdline-tools/latest/bin"
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/* "$SDK_DIR/tools/bin/"
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/* "$SDK_DIR/cmdline-tools/latest/bin/"
          ln -sf $ANDROID_HOME/build-tools "$SDK_DIR/build-tools"
          ln -sf $ANDROID_HOME/platforms "$SDK_DIR/platforms"
          ln -sf $ANDROID_HOME/platform-tools "$SDK_DIR/platform-tools"

      - name: Build APK with Buildozer
        env:
          ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk
        run: |
          buildozer android debug

      - name: Prepare APK for Artifact
        if: always()
        run: |
          mkdir -p bin_out
          find bin/ -name "*.apk" -exec cp {} bin_out/ \; || true
          find . -name "*.apk" -exec cp {} bin_out/ \; || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartRisk-apk
          path: bin_out/*.apk
          if-no-files-found: warn
